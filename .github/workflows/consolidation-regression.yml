# Consolidation regression (cross review of #240): the identity/budget contract and the browser tests no workflow ran.
# - guard: fails when a *.browser.test.cjs is run by no workflow (tests/regression-partitions.json is the manifest).
# - contract (BLOCKING): identity contract, budget import, cross-cutting journey and the suites they touch.
# - historical (NOT blocking): the files that were never in CI, in shards. A red here is evidence to classify
#   (pre-existing defect / obsolete assertion / regression) in the manifest, not a gate for unrelated changes.
name: Consolidation regression
# One run per workflow and PR: a newer push cancels the runs of the obsolete SHA (pushes to master are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Every browser test file is covered by CI
        run: node scripts/qa/check-browser-test-coverage.cjs
      - id: m
        run: echo "shards=$(node scripts/qa/check-browser-test-coverage.cjs --matrix)" >> "$GITHUB_OUTPUT"
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$RUNNER_TEMP/pw/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "THREE_LOCAL_DIR=$GITHUB_WORKSPACE/vendor/three" >> "$GITHUB_ENV"
      - name: Pure contracts (identity, library, budget import, unit history, coverage guard)
        run: node --test tests/project-identity.test.cjs tests/library.test.cjs tests/con-01-unit-history.test.cjs tests/con-03-budget-import.test.cjs tests/browser-test-coverage.test.cjs tests/budget-draft.test.cjs tests/budget-core.test.cjs tests/cat04-xr.test.cjs tests/review-notes-core.test.cjs tests/expediente.test.cjs
      - name: Browser contracts (blocking partition)
        run: |
          mkdir -p qa-results/consolidation
          IDENTITY_SHOTS=qa-results/consolidation CONSOLIDACION_SHOTS=qa-results/consolidation node --test --test-concurrency=1 $(node scripts/qa/check-browser-test-coverage.cjs --list blocking)
      - name: Expediente in a real browser (F0.1, IndexedDB + localStorage + Web Locks)
        run: node --test --test-concurrency=1 tests/expediente.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-results/consolidation
          if-no-files-found: ignore
  historical:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.guard.outputs.shards) }}
    env:
      # No GPU on the runner: the 3D view is drawn by SwiftShader on the CPU, so — as in presentation-ux-stability.yml —
      # every time budget, never an assertion, is multiplied by 3 (tests/helpers/render-budget.cjs). The per-file cap (1100 s × scale = 55 min, under the 60-min job limit; presentation.browser.test.cjs needs ~43–45 min)
      # scales with it. Owner approval for this workflow change: 17/11/2026.
      RENDER_TIME_SCALE: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$RUNNER_TEMP/pw/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "THREE_LOCAL_DIR=$GITHUB_WORKSPACE/vendor/three" >> "$GITHUB_ENV"
      - name: Historical shard ${{ matrix.shard }} (not blocking; one process per file so a hang cannot hide the rest)
        run: |
          mkdir -p qa-results/historical; status=0
          for f in $(node scripts/qa/check-browser-test-coverage.cjs --list "${{ matrix.shard }}"); do
            if timeout $((1100*RENDER_TIME_SCALE)) node --test --test-concurrency=1 "$f" > "qa-results/historical/$(basename "$f").tap" 2>&1; then r=ok; else r=RED; status=1; fi
            echo "$r $f $(grep -E '^# (pass|fail)' "qa-results/historical/$(basename "$f").tap" | tr '\n' ' ')" | tee -a qa-results/historical/summary-${{ matrix.shard }}.txt
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-results/historical
          if-no-files-found: ignore
