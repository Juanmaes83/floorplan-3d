# SCULPT-R01 lab: donor baseline in the workshop (R01, MIT) and the RUBIK adapter/comparator on synthetic plans.
# Lab only: labs/ is excluded from Vercel. No dependency install, no OCR engine, no network.
name: SCULPT-R01 lab
on:
  pull_request:
    branches: [master]
    paths:
      - 'labs/sculpt/r01-recognition/**'
      - 'tests/sculpt-r01-recognition.test.cjs'
      - 'js/plan-intake.js'
      - '.vercelignore'
      - '.github/workflows/sculpt-r01-lab.yml'
permissions:
  contents: read
jobs:
  lab-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Donor baseline (workshop copy)
        run: node --test labs/sculpt/r01-recognition/workshop/donor-recognition.test.cjs
      - name: Adapter, comparator and provenance guards
        run: node --test tests/sculpt-r01-recognition.test.cjs
