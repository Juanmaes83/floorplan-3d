name: FT3D-8V pure schedule and budget validation
on:
  push:
    branches:
      - feat/ft3d-8v-schedule-core-2026-11-05
    paths:
      - js/construction-schedule-core.js
      - js/construction-visual-state.js
      - js/construction-gantt-adapter.js
      - tests/construction-schedule-core.test.cjs
      - tests/construction-schedule-rules.test.cjs
      - tests/construction-visual-state.test.cjs
      - tests/fixtures/construction-schedule-fixtures.cjs
      - docs/product/ft3d-8v-*.md
      - .github/workflows/ft3d-8v-schedule-core.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          node --check js/construction-schedule-core.js
          node --check js/construction-visual-state.js
          node --check js/construction-gantt-adapter.js
          node --check tests/construction-schedule-core.test.cjs
          node --check tests/construction-schedule-rules.test.cjs
          node --check tests/construction-visual-state.test.cjs
          node --check tests/fixtures/construction-schedule-fixtures.cjs
      - name: Pure FT3D-8V and existing budget/story regression
        run: >-
          node --test
          tests/construction-schedule-core.test.cjs
          tests/construction-schedule-rules.test.cjs
          tests/construction-visual-state.test.cjs
          tests/budget-core.test.cjs
          tests/presentation-story.test.cjs
