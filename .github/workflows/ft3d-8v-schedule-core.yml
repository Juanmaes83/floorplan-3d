name: FT3D-8V pure schedule and budget validation
on:
  push:
    branches:
      - feat/ft3d-8v-schedule-core-2026-11-05
    paths:
      - js/construction-schedule-core.js
      - js/construction-visual-state.js
      - js/construction-gantt-adapter.js
      - js/construction-lab-presenter.js
      - labs/ft3d-8/**
      - tests/construction-schedule-core.test.cjs
      - tests/construction-schedule-rules.test.cjs
      - tests/construction-visual-state.test.cjs
      - tests/ft3d-8-lab.test.cjs
      - tests/ft3d-8-lab.browser.test.cjs
      - tests/fixtures/construction-schedule-fixtures.cjs
      - docs/product/ft3d-8v-*.md
      - .github/workflows/ft3d-8v-schedule-core.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax checks
        run: |
          for f in js/construction-schedule-core.js js/construction-visual-state.js js/construction-gantt-adapter.js \
                   js/construction-lab-presenter.js labs/ft3d-8/lab-fixture.js \
                   tests/construction-schedule-core.test.cjs tests/construction-schedule-rules.test.cjs \
                   tests/construction-visual-state.test.cjs tests/ft3d-8-lab.test.cjs tests/ft3d-8-lab.browser.test.cjs \
                   tests/fixtures/construction-schedule-fixtures.cjs; do node --check "$f"; done
          node --input-type=module --check < labs/ft3d-8/app.js
          node --input-type=module --check < labs/ft3d-8/scene.js
      - name: Pure FT3D-8V and existing budget/story regression
        run: >-
          node --test
          tests/construction-schedule-core.test.cjs
          tests/construction-schedule-rules.test.cjs
          tests/construction-visual-state.test.cjs
          tests/ft3d-8-lab.test.cjs
          tests/budget-core.test.cjs
          tests/presentation-story.test.cjs
  visual-lab-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser dependency (pinned, same as other browser workflows)
        run: |
          npm install --prefix "$RUNNER_TEMP/lab-tools" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/lab-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/lab-tools/node_modules" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$RUNNER_TEMP/lab-tools/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: FT3D-8 Visual Lab in real Chromium (1440x900 and 390x844)
        env:
          FT3D8_LAB_SHOTS: qa-results/ft3d-8-lab
        run: node --test --test-concurrency=1 tests/ft3d-8-lab.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft3d-8-visual-lab-screenshots
          path: qa-results/ft3d-8-lab
          if-no-files-found: ignore
