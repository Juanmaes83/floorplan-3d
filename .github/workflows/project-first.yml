# Project-First and Phase B browser and unit tests. Each cut of the stacked chain adds its own test files below.
name: Project-First regressions
# One run per workflow and PR: a newer push cancels the runs of the obsolete SHA (pushes to master are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  project-first:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      UNIT_TESTS: >-
        tests/project-visual.test.cjs
        tests/site-visual.test.cjs
        tests/ai-render-api.test.cjs
        tests/delivery-image.test.cjs
        tests/share-api.test.cjs
        tests/gov08-s1-adversarial.test.cjs
        tests/unshare-api.test.cjs
        tests/share-registry-core.test.cjs
        tests/gov08-s2-adversarial.test.cjs
        tests/gov08-view-isolation.test.cjs
        tests/plan-service.test.cjs
        tests/review-anchors.test.cjs
        tests/review-notes-core.test.cjs
        tests/moodboard.test.cjs
        tests/quantity-schedule.test.cjs
        tests/quantity-core.test.cjs
        tests/budget-draft.test.cjs
        tests/budget-core.test.cjs
        tests/budget-presentation.test.cjs
        tests/bc3-budget.test.cjs
        tests/fiebdc3-codec.test.cjs
        tests/budget-cost-bridge.test.cjs
        tests/cost-provider.test.cjs
      BROWSER_TESTS: >-
        tests/project-first.browser.test.cjs
        tests/project-views.browser.test.cjs
        tests/site-analyze.browser.test.cjs
        tests/project-dossier.browser.test.cjs
        tests/client-share.browser.test.cjs
        tests/ai-render.browser.test.cjs
        tests/delivery-image-detail.browser.test.cjs
        tests/tour-video.browser.test.cjs
        tests/share-link.browser.test.cjs
        tests/share-withdraw.browser.test.cjs
        tests/gov08-s2-focus.browser.test.cjs
        tests/gov08-view-isolation.browser.test.cjs
        tests/plan-service.browser.test.cjs
        tests/anchored-comments.browser.test.cjs
        tests/moodboard.browser.test.cjs
        tests/quantity-schedule.browser.test.cjs
        tests/budget-ui.browser.test.cjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Unit tests
        run: node --test --test-concurrency=1 $UNIT_TESTS
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pf-playwright" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/pf-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y ffmpeg
          echo "NODE_PATH=$RUNNER_TEMP/pf-playwright/node_modules" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$RUNNER_TEMP/pf-playwright/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Browser tests
        env:
          QA_DRONE_MP4: ${{ runner.temp }}/sculpt-drone.mp4
        run: node --test --test-concurrency=1 $BROWSER_TESTS
      - name: Verify the complete SCULPT drone export
        run: |
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames -of csv=p=0 "$RUNNER_TEMP/sculpt-drone.mp4")" = h264,640,360,8/1,433
          ffmpeg -v error -xerror -i "$RUNNER_TEMP/sculpt-drone.mp4" -f null -
      - name: Archive the SCULPT drone export
        uses: actions/upload-artifact@v4
        with:
          name: sculpt-drone-export
          path: ${{ runner.temp }}/sculpt-drone.mp4
          if-no-files-found: error
