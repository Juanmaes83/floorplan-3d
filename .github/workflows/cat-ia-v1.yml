name: CAT-IA V1 - catalogue (CAT-02) and visual reform (no paid provider)
# One run per workflow and PR: a newer push cancels the runs of the obsolete SHA (pushes to master are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  workflow_dispatch:
  pull_request:
    paths:
      - index.html
      - js/catalog-*.js
      - js/asset-ui.js
      - assets/f3/**
      - js/visual-reform-*.js
      - css/visual-studio.css
      - tests/visual-*.cjs
      - tests/cat-ia/**
      - api/photo-reform.js
      - js/photo-reform-*.js
      - tests/photo-reform-*.cjs
      - css/catalog.css
      - assets/cat-ia/**
      - scripts/cat-ia/**
      - scripts/qa/record-cat-ia-v1.cjs
      - scripts/qa/record-cat04.cjs
      - tests/catalog-*.cjs
      # CAT-04: catalogue → budget → assistant and visual references
      - js/cat04-ui.js
      - js/visual-reference-core.js
      - js/budget-*.js
      - js/reference-prices-ui.js
      - js/cost-*.js
      - js/assistant-*.js
      - tests/cat04*.cjs
      - tests/photo-project/kit.cjs
      - tests/r02a/editor-kit.cjs
      - tests/editor-fixture.cjs
      - js/brand-*.js
      - js/professional-workspace-ui.js
      - docs/cat-ia/**
      - .github/workflows/cat-ia-v1.yml
permissions:
  contents: read
jobs:
  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Syntax
        run: for f in js/catalog-*.js js/visual-reform-*.js js/visual-reference-core.js js/cat04-ui.js api/photo-reform.js js/photo-reform-*.js scripts/qa/record-cat-ia-v1.cjs; do node --check "$f"; done
      # The fixture generator runs isolated (-I: no user site-packages, no PYTHON* env). On the runner's system Python a plain
      # «pip install» lands in the USER site-packages (system site is not writable), which -I ignores → ModuleNotFoundError.
      # A dedicated interpreter has a writable site-packages, so Pillow is visible under -I.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow 12.3.0 for the fixture generator (installed into the setup-python interpreter, importable under -I)
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          python -I -c "import PIL, sys; print('Pillow', PIL.__version__, 'at', PIL.__file__); sys.exit(PIL.__version__ != '12.3.0')"
      - name: Fixtures are reproducible (same pixels and collection from the generator; declared SHA-256 = committed files; CAT-03 GLBs byte-identical)
        run: |
          python -I scripts/cat-ia/make-fixtures.py --check
          python -I scripts/cat-ia/make-glb-fixtures.py --check
      - name: photo-reform/1 server (closed by default) against a LOCAL fake provider, and its browser client without provider secrets
        run: node --test --test-concurrency=1 tests/photo-reform-api.test.cjs tests/photo-reform-provider.test.cjs tests/visual-reform-core.test.cjs
      - name: The browser bundle carries no provider secret path (no Authorization header, no Bearer adapter)
        run: |
          if grep -nE "authorization:|Authorization:|httpAdapter\\(" js/photo-reform-*.js; then echo "provider secret path in browser code"; exit 1; fi
      - name: CAT-04 pure - catalogue lines in the one budget, S2 explicit apply, visual references, assistant (figure oracle)
        run: node --test --test-concurrency=1 tests/cat04-f1f2.test.cjs tests/cat04-xr.test.cjs tests/cat04-cross-review.test.cjs tests/catalog-budget-core.test.cjs tests/visual-reference-core.test.cjs tests/cat04-assistant.test.cjs tests/budget-draft.test.cjs tests/budget-cost-bridge.test.cjs tests/cost-catalog-core.test.cjs tests/assistant-ai-v2.test.cjs
      - name: CatalogProductV1 core, and the guards of R03, R02-A and the photo project with the catalogue loaded
        # The isolated provider test already runs in the photo-reform/1 step of this job.
        run: node --test --test-concurrency=1 tests/catalog-product-core.test.cjs tests/catalog-placement-core.test.cjs tests/assets.test.cjs tests/furniture-search.test.cjs tests/cost-provider.test.cjs tests/brand-core.test.cjs tests/r02a-activation.test.cjs tests/r03-integration-core.test.cjs tests/r03-cabinet-audit.test.cjs tests/photo-project-core.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install the browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/cat-playwright" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/cat-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/cat-playwright/node_modules" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$RUNNER_TEMP/cat-playwright/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "THREE_LOCAL_DIR=$GITHUB_WORKSPACE/vendor/three" >> "$GITHUB_ENV"
      - name: Real editor - My catalogues (desktop ES, phone EN, landscape ZH, negative cases)
        run: node --test --test-concurrency=1 tests/catalog-ia.browser.test.cjs
      - name: Real editor - Image studio (CAT-01 + FOT visual; labelled local simulation, real generation blocked)
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 tests/visual-studio.browser.test.cjs
      - name: Real editor - CAT-03 product from my studio (validated GLB or labelled generic volume, undo, duplicate, reopen, export/import, rotated plan)
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 tests/catalog-placement.browser.test.cjs
      # Asset catalogue suite in its own step: a failure here (see docs/cat-ia/05-assets-browser-reproduccion.md, same two
      # tests fail on master c91d12d) still fails the job, but no longer hides the steps below. No test is skipped.
      - name: Real editor - CAT-04 catalogue → Presupuestar → assistant → dossier, Image studio references (desktop ES, phone EN, landscape ZH)
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 tests/cat04.browser.test.cjs tests/cat04-failsafe.browser.test.cjs tests/cat04-f1f2.browser.test.cjs tests/cat04-xr.browser.test.cjs
      - name: Presupuestar, reference prices (S2/M2) and economic dossier keep working with CAT-04 loaded
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 tests/budget-ui.browser.test.cjs tests/m2-s4.browser.test.cjs tests/economic-dossier.browser.test.cjs
      - name: Asset catalogue (F3 + CAT-03 manifest) - full assets.browser suite
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 tests/assets.browser.test.cjs
      - name: My studio, brand and the photo project keep working with the catalogue loaded
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 tests/professional-workspace.browser.test.cjs tests/brand.browser.test.cjs tests/photo-project.browser.test.cjs
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install the browser test runtime and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --prefix "$RUNNER_TEMP/cat-playwright" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/cat-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/cat-playwright/node_modules" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$RUNNER_TEMP/cat-playwright/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "THREE_LOCAL_DIR=$GITHUB_WORKSPACE/vendor/three" >> "$GITHUB_ENV"
      - name: Record the journeys with real controls (videos checked with ffprobe and a full ffmpeg decode), screenshots and manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/qa/record-cat-ia-v1.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-ia-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-results/cat-ia-v1
          if-no-files-found: error
      - name: CAT-04 evidence - full catalogue → budget → assistant → dossier flow and Image studio references, desktop and phone (videos ffprobe + full decode, manifest)
        if: ${{ !cancelled() }}
        run: node scripts/qa/record-cat04.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat04-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-results/cat04
          if-no-files-found: error
