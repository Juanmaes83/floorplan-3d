name: Blueprint and Despiece browser validation
on:
  pull_request:
    paths:
      - 'bpdp/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'tests/bpdp-*.browser.test.cjs'
      - '.github/workflows/bpdp-browser.yml'
permissions:
  contents: read
concurrency:
  group: bpdp-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install browser and video validation tools
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y ffmpeg
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Run product and delivery route suites
        run: |
          python3 -m http.server 43987 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:43987/ --output /dev/null
          node --test --test-concurrency=1 tests/bpdp-candidate.browser.test.cjs tests/bpdp-routes.browser.test.cjs
