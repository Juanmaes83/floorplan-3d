name: OP-02 targeted Presentation diagnostics
on:
  push:
    branches: [codex/verify-op02-ci-delta]
    paths: [.github/workflows/verify-op02-ci-delta.yml]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: presentation-light
            pattern: M09 restores preexisting
          - suite: presentation-elevation
            pattern: autoplay pauses and resumes
    env:
      RENDER_TIME_SCALE: '3'
      SUITE: ${{ matrix.suite }}
      PATTERN: ${{ matrix.pattern }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Set up the original browser and evidence profile
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          echo "CHROME=$(NODE_PATH=$RUNNER_TEMP/pw/node_modules node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
          echo "THREE_LOCAL_DIR=$GITHUB_WORKSPACE/vendor/three" >> "$GITHUB_ENV"
      - name: Verify the synchronization fix with the original verdict
        run: |
          git rev-parse HEAD
          node --test --test-concurrency=1 --test-name-pattern="$PATTERN" "tests/$SUITE.browser.test.cjs"
